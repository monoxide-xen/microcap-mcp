[project]
name = "microcap-mcp"
version = "0.1.1"
description = "MCP server exposing Micro-Cap 12 circuit simulation to LLM agents"
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monoxide-xen" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "spice",
    "circuit-simulation",
    "micro-cap",
    "eda",
    "electronics",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/monoxide-xen/microcap-mcp"
Repository = "https://github.com/monoxide-xen/microcap-mcp"
Issues = "https://github.com/monoxide-xen/microcap-mcp/issues"

[project.scripts]
microcap-mcp = "microcap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcap_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
